name: CI

on:
  # Sem filtro de branch: cobre PR de qualquer origem, que e por onde o codigo
  # entra. E o gatilho que roda no dia a dia.
  pull_request:
  push:
    # Push aqui e a ultima rede: pega o que entrar sem passar por PR e deixa
    # o historico de cada branch com status proprio, em vez de depender do
    # resultado do PR que originou cada merge.
    #
    # So `main`, e agora ela acumula os dois papeis: e o `default_branch` do
    # repositorio e, desde 23/08, a Production Branch da Vercel -- commit
    # nela publica producao de verdade.
    #
    # `cursor/login-page-performance-lab` saiu desta lista junto com a troca.
    # Ela era o alvo de producao ate 23/08, e por isso precisava de CI e de
    # protecao proprias; hoje nao publica nada e nao tem papel nenhum.
    #
    # Sem esta entrada, push direto (fora de PR) ficaria sem cobertura de CI
    # nenhuma, e a protecao de `main` (checks `build` e `banco` obrigatorios,
    # aplicada em 23/08) nao teria o que checar.
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SHA do commit da v4.4.0, nao o do objeto de tag (a15d269...): a tag e
      # anotada, e o Actions so resolve action por commit.
      # Sem `version:`: o action le o campo `packageManager` do package.json.
      # Local e CI passam a concordar sozinhos, sem manter os dois em sincronia
      # na mao.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Depois do action-setup de proposito: o cache pnpm do setup-node
      # precisa do pnpm ja no PATH para resolver o diretorio do store.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 24 e a versao usada no desenvolvimento, e o pnpm 11 exige >= 22.13:
          # com Node 20 ele quebra em node:sqlite antes de qualquer passo rodar.
          node-version: 24
          cache: pnpm

      # Substituto do "non-provider patterns" do secret scanning do GitHub,
      # que exige o add-on pago Secret Protection (`advanced_security: null`
      # neste repositorio) -- achado B-7 da auditoria de AppSec de 28/08.
      #
      # O scanning gratuito reconhece formato de PROVEDOR: pegaria uma chave
      # `re_...` da Resend ou uma do Supabase. Nao pega os tres segredos que
      # este projeto gera a mao -- `SUPABASE_WEBHOOK_SECRET`,
      # `IMPORTACAO_SECRET` e `CRON_SECRET` sao, por desenho, string aleatoria
      # sem formato ("gere uma string aleatoria aqui", diz o .env.example). Sao
      # justamente os que autenticam tres rotas por segredo compartilhado.
      #
      # Varre a ARVORE, e nao o diff: pega tambem o que ja tiver entrado antes,
      # e nao depende de `fetch-depth: 0` nem de base de comparacao -- que
      # mudaria entre o gatilho `pull_request` e o `push`.
      #
      # `.env.example` fica de fora porque e onde os placeholders moram de
      # proposito. Este proprio arquivo tambem, senao o padrao se acha.
      - name: Segredo compartilhado versionado?
        run: |
          padrao='(SUPABASE_WEBHOOK_SECRET|IMPORTACAO_SECRET|CRON_SECRET|SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|SENTRY_AUTH_TOKEN)[[:space:]]*=[[:space:]]*[^[:space:]]'
          if git grep -nIE "$padrao" -- . ':!*.env.example' ':!.github/workflows/ci.yml'; then
            echo "::error::Segredo com valor atribuido em arquivo versionado. Tire o valor, rotacione a chave e use variavel de ambiente."
            exit 1
          fi
          echo "Nenhum segredo compartilhado com valor no repositorio."

      - run: pnpm install --frozen-lockfile
      # Falha o build em vulnerabilidade alta/critica de dependencia.
      # audit-level=high para nao travar CI por achado low/moderate que
      # nao tem fix disponivel ainda.
      - run: pnpm audit --audit-level=high
      - run: pnpm run lint
      # Um tsc por workspace: a raiz nao tem mais tsconfig proprio -- nao ha
      # codigo de aplicacao nela. Cada um roda com as libs certas: o tsconfig
      # do Expo nao inclui `dom`, entao um `window` indevido no app de campo
      # falha aqui em vez de passar batido por herdar a config do painel.
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter @projeto-renatoo/shared exec tsc --noEmit
      - run: pnpm --filter mobile exec tsc --noEmit

      - run: pnpm test

      # NEXT_PUBLIC_* sao valores publicos (protegidos pelo RLS no Supabase),
      # mas ficam como secret do repositorio para nao cravar a URL/chave reais
      # em YAML versionado e permitir trocar por ambiente sem editar o workflow.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Tudo que exige um Postgres de verdade, num job so -- os dois checks abaixo
  # dividem o mesmo `supabase start`, que e a parte cara (~1-2 min):
  #
  #   1) Anti-drift de `database.types.ts`. Unico check que compara o tipo com
  #      o *schema*, e nao consigo mesmo: `tsc --noEmit` passa feliz tipando
  #      contra um schema velho, que foi exatamente como o drift corrigido em
  #      e3e6279 chegou ate a main.
  #   2) pgTAP: as policies de RLS. Ate a 0038 esta suite nao rodava contra
  #      banco local nenhum (os grants vinham do default ACL da plataforma, que
  #      nao estava versionado) -- os testes eram executados a mao contra
  #      producao, dentro de transacao com rollback. Agora o schema e
  #      auto-suficiente e isto roda em todo PR.
  #
  # Job separado do `build` de propósito: nada aqui depende dele, entao os dois
  # correm em paralelo em vez de somar tempo no gate.
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # A CLI vem do lockfile (devDependency `supabase`), nao de `npx` nem do
      # setup-cli: local e CI geram com a mesma versao, senao a diferenca de
      # formatacao entre duas versoes da CLI vira "drift" que nao existe.
      - run: pnpm install --frozen-lockfile

      # So os servicos que `gen types` e o pgTAP precisam. O resto (studio,
      # realtime, storage, edge runtime...) e imagem baixada e container subido
      # a toa.
      - run: pnpm exec supabase start -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - run: pnpm run types:generate

      - name: database.types.ts esta em dia com as migrations?
        run: |
          if ! git diff --quiet -- packages/shared/src/database.types.ts; then
            echo "::error file=packages/shared/src/database.types.ts::Desatualizado em relacao a supabase/migrations/. Rode 'pnpm run types:generate' com o stack local de pe e commite o resultado."
            git diff -- packages/shared/src/database.types.ts
            exit 1
          fi

      # `!cancelled()` em vez do encadeamento normal: sem isto, um drift de
      # tipo no passo acima esconderia uma policy de RLS quebrada, e voce
      # corrigiria um, subiria de novo e so entao descobriria o outro. Os dois
      # sao independentes -- o run deve reportar os dois.
      - name: pgTAP (policies de RLS)
        if: ${{ !cancelled() }}
        run: pnpm run test:db

  # Playwright. Era a unica suite que ninguem rodava automaticamente -- e a
  # unica que exercita o login num navegador de verdade, com o proxy.ts no
  # caminho e o cookie de sessao sendo gravado e lido como em producao. Os
  # testes de `pnpm test` cobrem `updateSession` com o `@supabase/ssr` mockado:
  # provam a logica, nao o fluxo.
  #
  # Job proprio pelo mesmo motivo do `banco`: nada aqui depende do `build`,
  # entao os tres correm em paralelo em vez de somar tempo no gate.
  #
  # SEM CREDENCIAL O JOB AINDA VALE. Os specs que precisam de conta real se
  # pulam sozinhos quando `E2E_EMAIL` e companhia faltam (`test.skip(...)`, ver
  # o cabecalho do playwright.config.ts). O que roda sem nenhum segredo ja e a
  # maior parte: validacao do formulario, credencial invalida, `redirectTo`
  # preservado e bloqueio por tentativas. Configurar os secrets depois acende
  # os demais sem precisar editar este arquivo.
  e2e:
    runs-on: ubuntu-latest
    # Teto de seguranca: o `webServer` do Playwright sobe um `next dev`, e um
    # servidor que nunca responde deixaria o job pendurado ate o limite padrao
    # do GitHub (6 horas) em vez de falhar.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # So o chromium: e o unico projeto declarado no playwright.config.ts.
      # `--with-deps` instala as bibliotecas de sistema que o runner nao traz.
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Playwright (login de ponta a ponta)
        run: pnpm run test:e2e
        env:
          # O `next dev` que o Playwright sobe passa por `lib/env.ts`, que
          # lanca erro se estas faltarem -- sem elas o webServer nem inicia.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Opcionais: ausentes, os specs de conta real se pulam sozinhos.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_INACTIVE_EMAIL: ${{ secrets.E2E_INACTIVE_EMAIL }}
          E2E_INACTIVE_PASSWORD: ${{ secrets.E2E_INACTIVE_PASSWORD }}
          # O reporter `html` abre o relatorio no navegador quando ha falha.
          # Em CI nao ha navegador para abrir, e o passo ficaria esperando.
          PLAYWRIGHT_HTML_OPEN: never

      # So em falha: o relatorio traz o trace da primeira repeticao
      # (`trace: "on-first-retry"`), que e o que permite ver o que a tela
      # estava fazendo sem reproduzir na mao.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
