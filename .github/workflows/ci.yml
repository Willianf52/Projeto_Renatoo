name: CI

on:
  pull_request:
  push:
    # Branch padrao do repositorio. Nao existe "main" aqui -- apontar para ele
    # deixava o gatilho de push inerte, e so o de pull_request funcionava.
    branches: [cursor/login-page-performance-lab]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SHA do commit da v4.4.0, nao o do objeto de tag (a15d269...): a tag e
      # anotada, e o Actions so resolve action por commit.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # Sem isto o action aborta: ele le a versao do campo packageManager
          # do package.json, que o projeto nao tem.
          version: 11.18.0

      # Depois do action-setup de proposito: o cache pnpm do setup-node
      # precisa do pnpm ja no PATH para resolver o diretorio do store.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

      # NEXT_PUBLIC_* sao valores publicos (protegidos pelo RLS no Supabase),
      # mas ficam como secret do repositorio para nao cravar a URL/chave reais
      # em YAML versionado e permitir trocar por ambiente sem editar o workflow.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
