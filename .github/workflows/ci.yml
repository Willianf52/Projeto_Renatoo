name: CI

on:
  # Sem filtro de branch: cobre PR de qualquer origem, que e por onde o codigo
  # entra. E o gatilho que roda no dia a dia.
  pull_request:
  push:
    # Branch padrao do repositorio. O push aqui e a ultima rede: pega o que
    # entrar sem passar por PR e deixa o historico de main com status proprio,
    # em vez de depender do resultado do PR que originou cada merge.
    #
    # Apontava para cursor/login-page-performance-lab, com um comentario
    # afirmando que main nao existia. Existe (origin/HEAD -> origin/main), e o
    # efeito era o inverso do descrito: main ficava sem cobertura nenhuma.
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SHA do commit da v4.4.0, nao o do objeto de tag (a15d269...): a tag e
      # anotada, e o Actions so resolve action por commit.
      # Sem `version:`: o action le o campo `packageManager` do package.json.
      # Local e CI passam a concordar sozinhos, sem manter os dois em sincronia
      # na mao.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Depois do action-setup de proposito: o cache pnpm do setup-node
      # precisa do pnpm ja no PATH para resolver o diretorio do store.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 24 e a versao usada no desenvolvimento, e o pnpm 11 exige >= 22.13:
          # com Node 20 ele quebra em node:sqlite antes de qualquer passo rodar.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Falha o build em vulnerabilidade alta/critica de dependencia.
      # audit-level=high para nao travar CI por achado low/moderate que
      # nao tem fix disponivel ainda.
      - run: pnpm audit --audit-level=high
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

      # NEXT_PUBLIC_* sao valores publicos (protegidos pelo RLS no Supabase),
      # mas ficam como secret do repositorio para nao cravar a URL/chave reais
      # em YAML versionado e permitir trocar por ambiente sem editar o workflow.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
