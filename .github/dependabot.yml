version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # O pnpm 11 recusa pacote publicado ha menos de 24h
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION), e o Dependabot abre PR assim
    # que a versao sai -- o install falhava antes de rodar qualquer teste.
    # Todos os prazos ficam acima de 24h de proposito: um valor 0 aqui, como
    # no exemplo da documentacao, traria a falha de volta para aquele tier.
    cooldown:
      default-days: 3
      # Major merece mais tempo de maturacao: e a atualizacao que costuma
      # exigir mudanca de codigo, como o Next 16 no PR #8.
      semver-major-days: 7
    open-pull-requests-limit: 10
    # Patch e minor num PR so por semana; major continua um PR por pacote.
    #
    # Motivo operacional, nao estetico: a `main` exige branch em dia (`strict`)
    # e o auto-merge (workflows/dependabot-auto-merge.yml) nao atualiza PR
    # atrasado. Com um PR por pacote, o primeiro merge deixava todos os outros
    # para tras e a fila travava. Com o grupo, ha um PR a mergear.
    #
    # O custo: um pacote que quebra a CI segura o grupo inteiro. Nesse caso,
    # `@dependabot ignore <pacote>` no PR tira o culpado e o grupo segue --
    # e o pacote vira a investigacao da vez, em vez de sumir na fila.
    groups:
      npm-patch-e-minor:
        update-types: ["patch", "minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Mesmo arranjo do npm. As actions sao fixadas por SHA no ci.yml; o
    # Dependabot atualiza o SHA e o comentario da versao juntos.
    groups:
      actions-patch-e-minor:
        update-types: ["patch", "minor"]
