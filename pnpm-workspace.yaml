packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@sentry/cli'
  - sharp
  - unrs-resolver

overrides:
  postcss: ^8.5.18
  sharp: ^0.35.0
  brace-expansion: ^1.1.17
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  # GHSA-w5hq-g745-h8pq (moderate): uuid < 11.1.1 nao confere o limite do
  # buffer em v3/v5/v6 quando `buf` e passado. Entra so por
  # apps/mobile > expo > @expo/config-plugins > xcode, que declara `^7.0.3` e
  # nao vai subir -- o xcode esta parado na 3.0.1 desde entao.
  #
  # A versao vulneravel nao e alcancavel aqui: o unico ponto de uso no xcode
  # e `uuid.v4()` (pbxProject.js:90, generateUuid), sem `buf` e fora das
  # versoes afetadas. O override e higiene de inventario, nao correcao de um
  # buraco aberto -- serve para o Dependabot parar de apontar uma linha que
  # nunca executa.
  #
  # Seguro apesar do salto de major: o xcode so toca `v4()`, que segue como
  # export nomeado em CJS. O piso e a 11.1.1 (primeira corrigida), mas sem
  # teto a resolucao cai na 14.0.2 -- e foi nela que `generateUuid()` foi
  # conferido, devolvendo o hex de 24 casas que o pbxproj exige. Nenhum outro
  # pacote do lock usa uuid.
  uuid@<11.1.1: '>=11.1.1'

  # GHSA-jqff-g426-hqxp e mais tres (todos high): `fast-uri` < 3.1.6 confunde
  # host em URL com esquema percent-encoded e com IDN pulado -- o suficiente
  # para uma checagem de destino aceitar um endereco e a requisicao sair para
  # outro. Entra so por apps/web > @sentry/nextjs > @sentry/webpack-plugin >
  # webpack > schema-utils > ajv.
  #
  # Nao e um override que force incompatibilidade: o `ajv` declara
  # `fast-uri: ^3.0.1`, entao a versao corrigida ja cabia -- o lockfile e que
  # estava parado na 3.1.5. `pnpm update -r fast-uri` nao a alcanca por ser
  # transitiva, dai o piso explicito aqui.
  #
  # COM TETO, e nao `>=3.1.6`: sem ele a resolucao pula para a 4.x -- um major
  # acima do que o `ajv` declara, trocando quatro advisories por um risco de
  # incompatibilidade em tempo de build. Mesma licao do `uuid` acima.
  #
  # O alcance real e o bundler do Sentry em tempo de build; nenhuma URL de
  # terceiro passa por esse parser em producao. Ainda assim se corrige em vez
  # de ignorar por id, porque aqui existe versao corrigida e ela entra sem
  # quebrar nada -- diferente do `image-size` e do `decode-uri-component`
  # abaixo, onde a correcao nao e aplicavel.
  'fast-uri@<3.1.6': '^3.1.6'

# Dois advisories high do `image-size` (<=2.0.2) que entram unicamente por
# apps/mobile > expo > @expo/cli > metro. Nao ha correcao aplicavel: o Metro
# 0.84.4 declara `image-size@^1.0.2` e consome o *default export*
# (`_interopRequireDefault` em metro/src/Assets.js), que a v2 -- a primeira
# versao corrigida -- removeu. Um override para 2.0.3 troca um risco teorico
# por um bundler quebrado ao processar asset.
#
# O alcance real e o bundler em maquina de desenvolvimento e no build do
# Expo, sobre imagem que nos mesmos colocamos no repositorio; o app web
# publicado nao carrega nada disto. O resto do portao continua ativo -- estes
# dois GHSAs sao ignorados por id, nao a categoria high inteira.
#
# Revisitar quando o Expo subir o Metro: `pnpm why image-size` mostra se
# ainda cai na 1.x.
# GHSA-vcc3-ghjq-m6fr (moderate): `decode-uri-component` <=0.4.2 faz decodificacao
# exponencial em percent-encoding malformado. Entra so por
# apps/mobile > @react-navigation/native > @react-navigation/core > query-string.
#
# NAO E ALCANCAVEL AQUI. O `query-string` existe no @react-navigation para
# interpretar URL de DEEP LINK, e este app nao tem deep link: `app.json` nao
# declara `scheme` e o `NavigationContainer` (src/navegacao/Navegacao.tsx) e
# montado sem a prop `linking`. Nenhuma URL de terceiro chega ao parser --
# so texto que o proprio app constroi.
#
# Nao ha override aplicavel, mesmo caso do `image-size` abaixo: o advisory diz
# "patched >=0.4.3", mas essa versao NAO EXISTE no registro -- as publicadas
# pulam de 0.4.1 para 0.5.0. E a 0.5.0 e ESM puro (`"type": "module"`, com
# `exports` so de entrada ESM), enquanto o query-string 7.1.3 e CommonJS e faz
# `require('decode-uri-component')` (index.js:3). O override trocaria um DoS
# inalcancavel por navegacao quebrada no app de campo.
#
# Revisitar quando o @react-navigation subir o query-string para a linha 9.x,
# que ja usa a API nativa de URL: `pnpm why query-string` mostra se ainda entra.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vcc3-ghjq-m6fr

minimumReleaseAgeExclude:
  - expo-file-system@57.0.6
  - expo-image-picker@57.0.14
